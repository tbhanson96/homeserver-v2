name: Publish image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Full master-branch commit SHA to publish
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-homeserver
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish exact commit
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Verify exact master commit
        env:
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_REF"
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$RELEASE_REF"
          echo "RELEASE_SHA=$RELEASE_REF" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Test server
        working-directory: server
        run: npm test

      - name: Test client
        working-directory: client
        run: npm run test -- --watch=false

      - name: Build production application
        run: npm run build:prod

      - name: Audit server production dependencies
        working-directory: server
        run: npm audit --omit=dev --audit-level=critical

      - name: Audit client production dependencies
        working-directory: client
        run: npm audit --omit=dev --audit-level=critical

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build exact image
        run: |
          docker build \
            --build-arg GIT_SHA="$RELEASE_SHA" \
            --tag "ghcr.io/tbhanson96/homeserver:sha-$RELEASE_SHA" \
            --tag ghcr.io/tbhanson96/homeserver:latest \
            .

      - name: Publish immutable and latest tags
        run: |
          docker push "ghcr.io/tbhanson96/homeserver:sha-$RELEASE_SHA"
          docker push ghcr.io/tbhanson96/homeserver:latest
