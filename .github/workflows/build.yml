name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  install:
    name: Install dependencies 
    runs-on: ubuntu-24.04-arm 
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Download server dependencies 
        working-directory: server
        run: npm ci

      - name: Download client dependencies 
        working-directory: client
        run: npm ci

      - name: Cache dependencies
        uses: actions/cache@v6
        id: restore-dependencies-cache
        with:
          path: |
            server/node_modules
            client/node_modules
          key: dependencies-${{ github.sha }}

  
  build:
    name: Build project
    runs-on: ubuntu-24.04-arm 
    needs: install
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@v6
        id: restore-dependencies-cache
        with:
          path: |
            server/node_modules
            client/node_modules
          key: dependencies-${{ github.sha }}

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Build client
        working-directory: client
        run: npm run build:prod

      - uses: actions/cache@v6
        id: build-cache
        with:
          path: |
            server/dist
            client/dist
          key: build-${{ github.sha }}
  
  test:
    name: Test Project
    runs-on: ubuntu-24.04-arm 
    needs: install
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@v6
        id: restore-dependencies-cache
        with:
          path: |
            server/node_modules
            client/node_modules
          key: dependencies-${{ github.sha }}
      - name: Run server tests
        working-directory: server
        run: npm run test
      - name: Run client tests
        working-directory: client
        run: npm run test -- --watch=false
      - name: Audit server production dependencies
        working-directory: server
        run: npm audit --omit=dev --audit-level=critical
      - name: Audit client production dependencies
        working-directory: client
        run: npm audit --omit=dev --audit-level=critical
